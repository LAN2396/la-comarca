<div id="panel-historial-facturas" class="panel-seccion hidden space-y-5 w-full mt-2">
    
    <div class="bg-white rounded-xl shadow-sm p-4 sm:p-5 border border-red-50 border-t-4 border-t-comarca-rojo">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-[10px] font-black text-gray-500 uppercase mb-1 ml-1">Buscar Cliente o N°</label>
                <input type="text" id="filtro_fact_cliente" oninput="filtrarFacturas()" placeholder="Ej: CF-0009" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-red-900">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-500 uppercase mb-1 ml-1">Estado / Método</label>
                <select id="filtro_fact_condicion" onchange="filtrarFacturas()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-red-900 cursor-pointer">
                    <option value="todas">Todas las facturas</option>
                    <option value="efectivo">💵 Efectivo</option>
                    <option value="transferencia">🏦 Transf. / Zelle</option>
                    <option value="pago movil">📱 Pago Móvil</option>
                    <option value="credito">⚠️ Crédito (Deuda)</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-500 uppercase mb-1 ml-1">Filtro de Fecha</label>
                <select id="filtro_fact_fecha" onchange="cambiarFiltroFechaPOS()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-red-900 cursor-pointer">
                    <option value="Todas">Todas las fechas</option>
                    <option value="Hoy">Solo Hoy</option>
                    <option value="Semana">Últimos 7 días</option>
                    <option value="Mes">Este Mes</option>
                    <option value="Personalizado">Rango...</option>
                </select>
            </div>
        </div>
        
        <div id="rango_fechas_pos" class="hidden mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4 bg-red-50 p-4 rounded-lg border border-red-100 shadow-inner">
            <div>
                <label class="block text-[10px] font-black text-comarca-rojo uppercase mb-1 ml-1">Desde</label>
                <input type="date" id="filtro_fecha_desde" onchange="filtrarFacturas()" class="w-full p-2 bg-white border border-red-200 rounded-lg text-sm font-bold outline-none focus:ring-1 focus:ring-red-900">
            </div>
            <div>
                <label class="block text-[10px] font-black text-comarca-rojo uppercase mb-1 ml-1">Hasta</label>
                <input type="date" id="filtro_fecha_hasta" onchange="filtrarFacturas()" class="w-full p-2 bg-white border border-red-200 rounded-lg text-sm font-bold outline-none focus:ring-1 focus:ring-red-900">
            </div>
        </div>
    </div>

    <!-- TARJETAS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-gray-800">
            <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Total Facturado</p>
            <p id="lbl_fact_total" class="text-2xl font-black font-mono text-gray-800 break-words">$0.00</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-emerald-500">
            <p class="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-1">Efectivo</p>
            <p id="lbl_fact_efectivo" class="text-2xl font-black font-mono text-emerald-600 break-words">$0.00</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-blue-500">
            <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1">Bancos</p>
            <p id="lbl_fact_bancos" class="text-2xl font-black font-mono text-blue-600 break-words">$0.00</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-comarca-rojo">
            <p class="text-[10px] font-black text-comarca-rojo uppercase tracking-widest mb-1">Por Cobrar</p>
            <p id="lbl_fact_credito" class="text-2xl font-black font-mono text-comarca-rojo break-words">$0.00</p>
        </div>
    </div>

    <!-- LISTA DE FACTURAS -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="bg-comarca-dorado p-3 flex justify-between items-center text-black">
            <h2 class="text-sm font-black uppercase tracking-widest flex items-center gap-2"><span>📋</span> Detalle de Registros</h2>
        </div>
        <div id="tabla-historial-facturas" class="flex flex-col divide-y divide-gray-200 bg-gray-50/50">
            <div class="p-6 text-center text-gray-400 font-bold italic text-sm">Cargando facturas...</div>
        </div>
    </div>
</div>
