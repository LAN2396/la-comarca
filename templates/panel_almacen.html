<div id="panel-almacen" class="panel-seccion hidden space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-t-4 border-t-purple-600">
            <h2 class="text-base font-bold text-purple-700 mb-4">➕ Registrar Nuevo Insumo</h2>
            <form id="formInsumo" class="space-y-4">
                <input type="text" id="insumo_nombre" placeholder="Ej: Alimento Iniciador" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold text-sm" required>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">CATEGORÍA</label>
                        <select id="insumo_cat" class="w-full p-2 bg-gray-50 border border-gray-300 rounded text-sm font-bold" required>
                            <option value="Alimento">Alimento (ABA)</option>
                            <option value="Empaque">Material Empaque</option>
                            <option value="Medicina">Medicina/Vitaminas</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">SE MIDE EN:</label>
                        <select id="insumo_unidad" class="w-full p-2 bg-gray-50 border border-gray-300 rounded text-sm font-bold" required>
                            <option value="Kg">Kilos (Kg)</option>
                            <option value="Unidades">Unidades</option>
                            <option value="ml">Mililitros (ml)</option>
                            <option value="Litros">Litros (L)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-purple-600 text-white font-bold p-3 rounded hover:bg-purple-800 transition shadow">Crear Insumo</button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-t-4 border-t-emerald-500">
            <h2 class="text-base font-bold text-emerald-700 mb-4">🛒 Ingreso a Stock</h2>
            <form id="formCompraInsumo" class="space-y-4">
                <select id="compra_insumo_id" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold text-sm" required>
                    <option value="" disabled selected>Cargando insumos...</option>
                </select>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">CANTIDAD COMPRADA</label>
                        <input type="number" step="1" min="0" id="compra_cantidad" placeholder="Ej: 10" class="w-full p-2 bg-gray-50 border border-gray-300 rounded text-sm font-bold" required>
                    </div>
                    <div class="flex items-center mt-4">
                        <input type="checkbox" id="compra_es_saco" class="w-5 h-5 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                        <label for="compra_es_saco" class="ml-2 text-[10px] font-bold text-gray-600">Sacos de 40kg</label>
                    </div>
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">COSTO TOTAL ($)</label>
                    <input type="number" step="0.1" min="0" id="compra_costo" placeholder="0.00" class="w-full p-2 bg-gray-50 border border-gray-300 rounded text-sm font-bold text-emerald-700" required>
                </div>
                
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold p-3 rounded hover:bg-emerald-800 transition shadow">Sumar Inventario</button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-t-4 border-t-red-600">
            <h2 class="text-base font-bold text-red-700 mb-4">⚠️ Reportar Merma</h2>
            <form id="formAjusteInsumo" class="space-y-4">
                <select id="ajuste_insumo_id" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold text-sm" required>
                    <option value="" disabled selected>Cargando insumos...</option>
                </select>
                
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">CANTIDAD A DESCONTAR</label>
                    <input type="number" step="1" min="1" id="ajuste_cantidad" placeholder="Ej: 1" class="w-full p-2 bg-gray-50 border border-gray-300 rounded text-sm font-bold text-red-700" required>
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">MOTIVO (Daño, Vencimiento, etc)</label>
                    <input type="text" id="ajuste_motivo" placeholder="Ej: Frasco roto" class="w-full p-2 bg-gray-50 border border-gray-300 rounded text-sm font-bold" required>
                </div>
                
                <button type="submit" class="w-full bg-red-600 text-white font-bold p-3 rounded hover:bg-red-800 transition shadow">Descontar del Inventario</button>
            </form>
        </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mt-6">
        <h2 class="text-lg font-black text-gray-800 mb-4">📦 Inventario Actual de Insumos</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-gray-100 text-gray-600 font-bold uppercase text-xs">
                    <tr>
                        <th class="px-4 py-3">Insumo</th>
                        <th class="px-4 py-3">Categoría</th>
                        <th class="px-4 py-3 text-right">Stock</th>
                        <th class="px-4 py-3 text-center">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-insumos-body" class="divide-y divide-gray-200">
                    </tbody>
            </table>
        </div>
    </div>
</div>
