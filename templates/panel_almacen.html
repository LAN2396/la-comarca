<div id="panel-almacen" class="panel-seccion hidden space-y-4 w-full mt-2">
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-1">
        <button onclick="toggleFormularioAlmacen('nuevo')" class="bg-white text-comarca-rojo hover:bg-red-50 font-black p-3 rounded-lg shadow-sm transition flex items-center justify-center gap-2 text-xs uppercase tracking-wide border border-gray-200">
            <span class="text-lg leading-none">📦</span> Crear Insumo
        </button>
        <button onclick="toggleFormularioAlmacen('compra')" class="bg-white text-emerald-700 hover:bg-emerald-50 font-black p-3 rounded-lg shadow-sm transition flex items-center justify-center gap-2 text-xs uppercase tracking-wide border border-gray-200">
            <span class="text-lg leading-none">🛒</span> Comprar (Sumar)
        </button>
        <button onclick="toggleFormularioAlmacen('merma')" class="bg-white text-gray-700 hover:bg-gray-100 font-black p-3 rounded-lg shadow-sm transition flex items-center justify-center gap-2 text-xs uppercase tracking-wide border border-gray-200">
            <span class="text-lg leading-none">⚠️</span> Reportar Merma
        </button>
    </div>

    <!-- FORMULARIOS (Centrados y compactos) -->
    <div class="max-w-2xl mx-auto w-full">
        <!-- Formulario A -->
        <div id="contenedor-form-insumo" class="hidden bg-white p-5 rounded-lg shadow-md border border-gray-200 border-t-4 border-t-comarca-rojo">
            <div class="flex justify-between items-center mb-4">
                <h2 id="titulo-form-insumo" class="text-base font-black text-comarca-rojo">📦 Registrar Nuevo Insumo</h2>
                <button onclick="toggleFormularioAlmacen('cerrar')" class="text-gray-400 hover:text-red-500 font-black text-xl leading-none px-2">&times;</button>
            </div>
            <form id="formInsumo" class="space-y-3 text-sm">
                <input type="hidden" id="insumo_id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Nombre del Insumo</label>
                        <input type="text" id="insumo_nombre" placeholder="Ej. Alimento Iniciador" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold text-gray-800 text-sm" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Categoría</label>
                        <select id="insumo_cat" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold text-gray-800 cursor-pointer text-sm" required>
                            <option value="Alimento">Alimento</option><option value="Medicina">Medicina</option><option value="Empaque">Empaque</option><option value="Higiene">Higiene</option><option value="Herramientas">Herramientas</option><option value="Otros">Otros</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Medida</label>
                        <select id="insumo_unidad" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold text-gray-800 cursor-pointer text-sm" required>
                            <option value="Kg">Kilos (Kg)</option><option value="Litros">Litros (L)</option><option value="Unidades">Unidades (Ud)</option><option value="Sacos">Sacos</option><option value="Gramos">Gramos (g)</option>
                        </select>
                    </div>
                    <div id="div-insumo-stock" class="hidden">
                        <label class="block text-[10px] font-black text-emerald-600 ml-1 mb-0.5 uppercase tracking-wider">Stock</label>
                        <input type="number" step="0.01" id="insumo_stock" value="0" class="w-full p-2.5 border border-emerald-300 bg-emerald-50 rounded focus:ring-1 focus:ring-emerald-600 outline-none font-black text-emerald-800 text-sm" required>
                    </div>
                    <div id="div-insumo-precio" class="hidden">
                        <label class="block text-[10px] font-black text-comarca-rojo ml-1 mb-0.5 uppercase tracking-wider">Precio ($)</label>
                        <input type="number" step="0.01" id="insumo_precio" value="0" class="w-full p-2.5 border border-red-300 bg-red-50 rounded focus:ring-1 focus:ring-red-800 outline-none font-black text-red-800 text-sm" required>
                    </div>
                </div>
                <button type="submit" id="btn-guardar-insumo" class="w-full h-10 bg-comarca-rojo text-white font-black rounded hover:bg-red-900 shadow-sm transition text-sm mt-1">Crear Insumo</button>
            </form>
        </div>

        <!-- Formulario B -->
        <div id="contenedor-form-compra" class="hidden bg-white p-5 rounded-lg shadow-md border border-gray-200 border-t-4 border-t-emerald-600">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-black text-emerald-700">🛒 Ingresar Compra</h2>
                <button onclick="toggleFormularioAlmacen('cerrar')" class="text-gray-400 hover:text-red-500 font-black text-xl leading-none px-2">&times;</button>
            </div>
            <form id="formCompraInsumo" class="space-y-3 text-sm">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Insumo</label>
                    <select id="compra_insumo_id" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-600 outline-none font-bold text-gray-800 cursor-pointer text-sm" required></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Cantidad</label>
                        <input type="number" step="1" min="0" id="compra_cantidad" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-600 outline-none font-black text-base text-center" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-red-600 ml-1 mb-0.5 uppercase tracking-wider">Costo Total ($)</label>
                        <input type="number" step="0.1" min="0" id="compra_costo" class="w-full p-2.5 bg-red-50 border border-red-200 rounded focus:ring-1 focus:ring-red-600 outline-none font-black text-base text-center text-red-700" required>
                    </div>
                </div>
                <label class="flex items-center gap-2 p-2.5 bg-gray-50 rounded border border-gray-200 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" id="compra_es_saco" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-600 cursor-pointer">
                    <span class="text-xs font-bold text-gray-700">Compré bultos/sacos enteros (x40Kg)</span>
                </label>
                <button type="submit" class="w-full h-10 bg-emerald-600 text-white font-black rounded hover:bg-emerald-800 shadow-sm transition text-sm mt-1">Guardar Compra</button>
            </form>
        </div>

        <!-- Formulario C -->
        <div id="contenedor-form-merma" class="hidden bg-white p-5 rounded-lg shadow-md border border-gray-200 border-t-4 border-t-gray-600">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-black text-gray-800">⚠️ Reportar Merma</h2>
                <button onclick="toggleFormularioAlmacen('cerrar')" class="text-gray-400 hover:text-red-500 font-black text-xl leading-none px-2">&times;</button>
            </div>
            <form id="formAjusteInsumo" class="space-y-3 text-sm">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Insumo a reducir</label>
                    <select id="ajuste_insumo_id" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-gray-600 outline-none font-bold text-gray-800 cursor-pointer text-sm" required></select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-red-600 ml-1 mb-0.5 uppercase tracking-wider">Cantidad a descontar</label>
                        <input type="number" step="0.01" min="0" id="ajuste_cantidad" class="w-full p-2.5 bg-red-50 border border-red-200 rounded focus:ring-1 focus:ring-red-600 outline-none font-black text-base text-center text-red-700" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Motivo</label>
                        <input type="text" id="ajuste_motivo" placeholder="Ej: Sacos rotos..." class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-gray-600 outline-none font-bold text-sm h-[42px]" required>
                    </div>
                </div>
                <button type="submit" class="w-full h-10 bg-gray-800 text-white font-black rounded hover:bg-black shadow-sm transition text-sm mt-1">Restar del Almacén</button>
            </form>
        </div>
    </div>

    <!-- INVENTARIO ACTUAL (Ancho Completo) -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden border border-gray-300">
        <div class="bg-comarca-rojo p-2.5 flex justify-between items-center text-white">
            <h2 class="text-xs font-black uppercase tracking-wider ml-1">Inventario Actual de Insumos</h2>
        </div>
        <div id="contenedor-insumos-grid" class="flex flex-col">
            <div class="p-8 text-center text-gray-500 font-bold animate-pulse text-sm">Cargando inventario...</div>
        </div>
    </div>

</div>

<script>
    function toggleFormularioAlmacen(accion) {
        const formInsumo = document.getElementById('contenedor-form-insumo');
        const formCompra = document.getElementById('contenedor-form-compra');
        const formMerma = document.getElementById('contenedor-form-merma');
        
        formInsumo.classList.add('hidden');
        formCompra.classList.add('hidden');
        formMerma.classList.add('hidden');

        if (accion === 'nuevo') {
            limpiarFormInsumo();
            formInsumo.classList.remove('hidden');
            formInsumo.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (accion === 'editar') {
            formInsumo.classList.remove('hidden');
            formInsumo.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (accion === 'compra') {
            formCompra.classList.remove('hidden');
            formCompra.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (accion === 'merma') {
            formMerma.classList.remove('hidden');
            formMerma.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }
</script>
