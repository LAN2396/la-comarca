<div id="panel-corrector" class="panel-seccion hidden grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-t-4 border-t-blue-500">
        <h2 class="text-base font-bold text-blue-700 mb-4 flex items-center gap-2">🔄 Corregir Producción / Bajas</h2>
        <div class="grid grid-cols-2 gap-2 mb-4">
            <select id="corr_prod_lote" class="w-full p-2 bg-gray-50 border border-gray-300 rounded text-sm font-bold text-gray-700" required></select>
            <input type="date" id="corr_prod_fecha" class="w-full p-2 bg-gray-50 border border-gray-300 rounded text-sm" required>
        </div>
        <button type="button" onclick="buscarProdParaCorregir()" class="w-full bg-blue-100 text-blue-700 font-bold p-2 rounded hover:bg-blue-200 text-sm mb-4">Buscar Registro</button>
        
        <form id="formCorrProd" class="space-y-4 hidden">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">NUEVA CANT. HUEVOS</label>
                <input type="number" min="0" id="nuevo_cant_huevos" class="w-full p-2.5 bg-white border border-blue-300 rounded" required>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">NUEVA MORTALIDAD (EL INVENTARIO SE AUTO-AJUSTARÁ)</label>
                <input type="number" min="0" id="nuevo_mortalidad" class="w-full p-2.5 bg-white border border-blue-300 rounded" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold p-3 rounded hover:bg-blue-800 shadow">Guardar Corrección</button>
        </form>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-t-4 border-t-amber-500">
        <h2 class="text-base font-bold text-amber-600 mb-4 flex items-center gap-2">🔄 Corregir Consumo de Alimento</h2>
        <div class="grid grid-cols-2 gap-2 mb-4">
            <select id="corr_alim_lote" class="w-full p-2 bg-gray-50 border border-gray-300 rounded text-sm font-bold text-gray-700" required></select>
            <input type="date" id="corr_alim_fecha" class="w-full p-2 bg-gray-50 border border-gray-300 rounded text-sm" required>
        </div>
        <button type="button" onclick="buscarAlimParaCorregir()" class="w-full bg-amber-100 text-amber-700 font-bold p-2 rounded hover:bg-amber-200 text-sm mb-4">Buscar Registro</button>
        
        <form id="formCorrAlim" class="space-y-4 hidden">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">NUEVO CONSUMO (KILOS)</label>
                <input type="number" step="0.01" min="0" id="nuevo_kilos" class="w-full p-2.5 bg-white border border-amber-300 rounded" required>
            </div>
            <button type="submit" class="w-full bg-amber-500 text-white font-bold p-3 rounded hover:bg-amber-600 shadow">Guardar Corrección</button>
        </form>
    </div>
</div>
