<div id="modalCobro" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-200">
        <div class="bg-gray-800 p-4 flex justify-between items-center">
            <h3 class="text-white font-bold text-lg flex items-center gap-2">💳 Cobrar Factura a Crédito</h3>
            <button onclick="cerrarModalCobro()" class="text-gray-400 hover:text-white font-black text-2xl leading-none">&times;</button>
        </div>
        <div class="p-6 space-y-5">
            <div class="bg-red-50 p-4 rounded-lg border border-red-200">
                <p class="text-sm text-red-800 font-bold">Cliente: <span id="cobro_cliente" class="font-black text-gray-900">---</span></p>
                <p class="text-sm text-red-800 font-bold">Factura: <span id="cobro_factura" class="font-mono font-black text-gray-900">---</span></p>
                <div class="mt-3 pt-3 border-t border-red-200 flex justify-between items-end">
                    <span class="text-xs font-black text-red-700 uppercase tracking-wider">Deuda Actual:</span>
                    <span class="text-2xl text-red-700 font-black font-mono">$<span id="cobro_deuda">0.00</span></span>
                </div>
            </div>
            
            <form id="formCobro" onsubmit="procesarCobro(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-black text-gray-600 mb-1">MONTO A ABONAR ($)</label>
                    <input type="number" step="0.01" min="0.01" id="cobro_monto" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg font-black text-emerald-700 text-xl outline-none focus:ring-2 focus:ring-emerald-500" required>
                    <div class="mt-2 text-right">
                        <button type="button" onclick="document.getElementById('cobro_monto').value = document.getElementById('cobro_deuda').innerText" class="text-[10px] bg-gray-200 hover:bg-gray-300 px-2.5 py-1 rounded font-black text-gray-700 transition uppercase tracking-wider shadow-sm">Liquidar Totalidad</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-black text-gray-600 mb-1">MÉTODO DE PAGO</label>
                    <select id="cobro_metodo" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg font-bold text-gray-800 outline-none" required>
                        <option value="Efectivo">💵 Efectivo</option>
                        <option value="Transferencia Bancaria">🏦 Transferencia / Zelle</option>
                        <option value="Pago Móvil">📱 Pago Móvil</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black p-3.5 rounded-lg shadow-md transition text-lg">Procesar Ingreso a Caja</button>
            </form>
        </div>
    </div>
</div>

<div id="modalPermisos" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border-2 border-blue-900">
        <div class="bg-blue-900 p-4 flex justify-between items-center text-white">
            <h2 class="text-lg font-black" id="tituloModalPermisos">🔧 Configurar Accesos</h2>
            <button onclick="document.getElementById('modalPermisos').classList.add('hidden')" class="text-white hover:text-red-400 font-bold text-xl">✖</button>
        </div>
        <div class="p-6">
            <p class="text-sm text-gray-600 mb-4 font-bold">Selecciona qué pestañas podrá ver y tocar este usuario:</p>
            
            <div id="listaCheckboxesPermisos" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[350px] overflow-y-auto p-2 border border-gray-200 rounded-lg bg-gray-50">
            </div>

            <div class="mt-6 flex justify-end gap-3">
                <button type="button" onclick="document.getElementById('modalPermisos').classList.add('hidden')" class="px-4 py-2 bg-gray-300 text-gray-800 font-bold rounded-lg shadow-sm hover:bg-gray-400">Cancelar</button>
                <button type="button" id="btnGuardarPermisos" class="px-5 py-2 bg-blue-800 text-white font-black rounded-lg shadow-md hover:bg-blue-900 transition">💾 Guardar Cambios</button>
            </div>
        </div>
    </div>
</div>
