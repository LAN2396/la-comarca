<div id="panel-productos" class="panel-seccion hidden space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 lg:col-span-1">
            <h2 id="titulo-form-producto" class="text-base font-bold text-comarca-rojo mb-4 flex items-center gap-2">📦 Registrar Nuevo Producto</h2>
            <form id="formProducto" class="space-y-4 text-sm">
                <input type="hidden" id="prod_id">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">CÓDIGO IDENTIFICADOR</label>
                    <input type="text" id="prod_codigo" placeholder="Ej: PRD-001, HUE-A, ALI-INI" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-mono uppercase font-bold shadow-inner" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">NOMBRE DEL PRODUCTO</label>
                    <input type="text" id="prod_nombre" placeholder="Nombre descriptivo" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">DESCRIPCIÓN (OPCIONAL)</label>
                    <textarea id="prod_descripcion" placeholder="Notas adicionales..." class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded h-16 resize-none"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">PRECIO X CARTÓN ($)</label>
                        <input type="number" step="0.01" min="0" id="prod_precio_carton" placeholder="0.00" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold text-emerald-700" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">PRECIO X CAJA (12 Cartones) ($)</label>
                        <input type="number" step="0.01" min="0" id="prod_precio_caja" placeholder="0.00" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold text-blue-700" required>
                    </div>
                </div>
                
                <div>
                    <label id="lbl_prod_stock" class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">CARTONES DISPONIBLES (STOCK INICIAL)</label>
                    <input type="hidden" id="prod_stock_actual" value="0">
                    <input type="number" step="0.5" min="0" id="prod_stock" placeholder="Ej: 10" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold" required>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="btn-guardar-producto" class="flex-1 bg-comarca-rojo text-white font-bold p-3 rounded hover:bg-red-900 transition shadow">Guardar Producto</button>
                    <button type="button" id="btn-cancelar-producto" onclick="limpiarFormProducto()" class="hidden bg-gray-500 text-white font-bold p-3 rounded hover:bg-gray-600 transition shadow">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 lg:col-span-2 flex flex-col">
            <div class="mb-4">
                <h2 class="text-base font-bold text-gray-800">Inventario y Lista de Productos</h2>
                <p class="text-xs text-gray-500">Consulta los insumos o productos finales registrados en La Comarca.</p>
            </div>
            <div class="overflow-x-auto border border-gray-200 rounded-lg flex-1 max-h-[480px] overflow-y-auto">
                <table class="min-w-full divide-y divide-gray-200 text-left text-sm">
                    <thead class="bg-gray-100 sticky top-0 shadow-sm z-10">
                        <tr>
                            <th class="px-4 py-3 font-semibold text-gray-700">Código</th>
                            <th class="px-4 py-3 font-semibold text-gray-700">Nombre / Categoría</th>
                            <th class="px-4 py-3 font-semibold text-gray-700 text-right">Precio</th>
                            <th class="px-4 py-3 font-semibold text-gray-700 text-right">Stock</th>
                            <th class="px-4 py-3 font-semibold text-gray-700 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos" class="divide-y divide-gray-200 bg-white">
                        <tr>
                            <td colspan="5" class="px-4 py-8 text-center text-gray-400 italic">Cargando inventario...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
