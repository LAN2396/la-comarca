<div id="panel-lotes" class="panel-seccion space-y-4 w-full mt-2">
    
    <!-- FICHA TÉCNICA (Ancho Completo) -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden border border-gray-300">
        <div class="bg-comarca-rojo p-2.5 flex flex-col md:flex-row justify-between md:items-center text-white gap-2">
            <h2 class="text-xs font-black uppercase tracking-wider ml-1">Lotes en Producción</h2>
            <div class="flex items-center gap-2">
                <label class="text-[9px] font-bold text-gray-200 hidden sm:inline">BUSCAR HISTÓRICO:</label>
                <select id="buscador_lote" onchange="renderizarFichas(this.value)" class="w-full md:w-56 p-1.5 text-black bg-white rounded font-bold outline-none text-xs cursor-pointer">
                    <option value="">Cargando base de datos...</option>
                </select>
            </div>
        </div>
        <div id="contenedor-fichas-lotes" class="flex flex-col">
            <div class="p-8 text-center text-gray-500 font-bold animate-pulse text-sm">Cargando la granja...</div>
        </div>
    </div>

    <!-- BOTONES DE ACCIÓN (Ancho Completo) -->
    <div class="flex flex-col sm:flex-row gap-3 mt-1">
        <button onclick="toggleFomulariosLote('nuevo')" class="flex-1 bg-white text-comarca-rojo hover:bg-red-50 font-black p-3 rounded-lg shadow-sm border border-gray-200 transition flex items-center justify-center gap-2 text-xs uppercase tracking-wide">
            <span class="text-lg leading-none">🐣</span> Registrar Lote
        </button>
        <button onclick="toggleFomulariosLote('editar')" class="flex-1 bg-white text-gray-700 hover:bg-gray-50 font-black p-3 rounded-lg shadow-sm border border-gray-200 transition flex items-center justify-center gap-2 text-xs uppercase tracking-wide">
            <span class="text-lg leading-none">✏️</span> Editar Lote
        </button>
        <button onclick="toggleFomulariosLote('gasto')" class="flex-1 bg-white text-emerald-700 hover:bg-emerald-50 font-black p-3 rounded-lg shadow-sm border border-gray-200 transition flex items-center justify-center gap-2 text-xs uppercase tracking-wide">
            <span class="text-lg leading-none">💸</span> Gasto Levante
        </button>
    </div>

    <!-- CONTENEDOR DE FORMULARIOS (Limitado y centrado para que no se vea gigante) -->
    <div class="max-w-2xl mx-auto w-full">
        <!-- FORMULARIO NUEVO LOTE -->
        <div id="contenedor-nuevo-lote" class="hidden bg-white p-5 rounded-lg shadow-md border border-gray-200 border-t-4 border-t-comarca-rojo">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-black text-comarca-rojo">🐣 Ingresar Nuevo Lote</h2>
                <button onclick="toggleFomulariosLote('cerrar')" class="text-gray-400 hover:text-red-500 font-black text-xl leading-none px-2">&times;</button>
            </div>
            <form id="formLote" class="space-y-3 text-sm">
                <input type="text" id="lote_nombre" placeholder="Nombre (Ej: Lote A-2026)" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold text-gray-800 text-sm" required>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <input list="lista_galpones" id="lote_galpon" placeholder="Galpón..." class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded text-gray-800 focus:ring-1 focus:ring-red-800 outline-none font-bold text-sm" required>
                        <datalist id="lista_galpones"><option value="Galpón 1"><option value="Galpón 2"><option value="Galpón Principal"><option value="Galpón de Levante"></datalist>
                    </div>
                    <div>
                        <select id="lote_raza" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded text-gray-800 focus:ring-1 focus:ring-red-800 outline-none font-bold cursor-pointer text-sm" required>
                            <option value="" disabled selected>Elegir Raza...</option>
                            <option value="Isa Brown">Isa Brown</option><option value="Lohmann Brown">Lohmann Brown</option><option value="Hy-Line Brown">Hy-Line Brown</option><option value="Babcock Brown">Babcock Brown</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3 items-end">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Cant. Aves</label>
                        <input type="number" id="lote_inicial" min="1" placeholder="Ej: 500" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold text-sm" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Edad Inic.</label>
                        <input type="number" id="lote_edad" min="0" placeholder="Ej: 16" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold text-sm" required>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">¿Edad en días o semanas?</label>
                        <select id="lote_edad_unidad" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold cursor-pointer text-sm" required>
                            <option value="semanas">Semanas</option><option value="dias">Días</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Fecha de Ingreso</label>
                        <input type="date" id="lote_fecha" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold text-gray-800 cursor-pointer text-sm" required>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-comarca-rojo ml-1 mb-0.5 uppercase tracking-wider">$ Costo de adquisición (Las Aves)</label>
                    <input type="number" step="0.1" min="0" id="lote_costo" placeholder="Monto pagado" class="w-full p-2.5 border-red-300 border bg-red-50 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold text-red-800 text-sm" required>
                </div>
                <button type="submit" class="w-full h-10 bg-comarca-rojo text-white font-black rounded hover:bg-red-900 shadow transition text-sm mt-2">Guardar Nuevo Lote</button>
            </form>
        </div>

        <!-- FORMULARIO EDITAR LOTE -->
        <div id="contenedor-editar-lote" class="hidden bg-white p-5 rounded-lg shadow-md border border-gray-200 border-t-4 border-t-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-black text-gray-800">✏️ Editar Datos Básicos</h2>
                <button onclick="toggleFomulariosLote('cerrar')" class="text-gray-400 hover:text-gray-600 font-black text-xl leading-none px-2">&times;</button>
            </div>
            <div class="flex flex-col sm:flex-row gap-2 mb-4 bg-gray-50 p-2.5 rounded border border-gray-200">
                <select id="edit_buscar_id" class="w-full p-2 bg-white border border-gray-300 rounded text-xs font-bold focus:ring-1 focus:ring-gray-700 outline-none cursor-pointer" required>
                    <option value="" disabled selected>Despliega y elige el lote...</option>
                </select>
                <button type="button" onclick="buscarLoteParaEditar()" class="w-full sm:w-auto bg-gray-800 text-white font-bold px-4 py-2 rounded hover:bg-black text-xs shadow transition">Cargar</button>
            </div>
            <form id="formEditarLote" class="space-y-3 text-sm hidden">
                <input type="hidden" id="edit_lote_id">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Nombre del Lote</label>
                    <input type="text" id="edit_lote_nombre" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-gray-700 outline-none font-bold text-sm" required>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Galpón</label>
                        <input type="text" id="edit_lote_galpon" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded text-gray-800 focus:ring-1 focus:ring-gray-700 outline-none font-bold text-sm" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Raza</label>
                        <input type="text" id="edit_lote_raza" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded text-gray-800 focus:ring-1 focus:ring-gray-700 outline-none font-bold text-sm" required>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 items-end">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Fecha Ingreso</label>
                        <input type="date" id="edit_lote_fecha" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-gray-700 outline-none font-bold text-sm" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Edad Inic.</label>
                        <input type="number" id="edit_lote_edad" min="0" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-gray-700 outline-none font-bold text-sm" required>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Unidad</label>
                    <select id="edit_lote_edad_unidad" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-gray-700 outline-none font-bold cursor-pointer text-sm" required>
                        <option value="semanas">Semanas</option><option value="dias">Días</option>
                    </select>
                </div>
                <button type="submit" class="w-full h-10 bg-gray-800 text-white font-black rounded hover:bg-black shadow transition text-sm mt-1">Guardar Corrección</button>
            </form>
        </div>

        <!-- FORMULARIO GASTO LE কমপক্ষে -->
        <div id="contenedor-gasto-levante" class="hidden bg-white p-5 rounded-lg shadow-md border border-gray-200 border-t-4 border-t-emerald-500">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-black text-emerald-700">💸 Registrar Gasto de Levante</h2>
                <button onclick="toggleFomulariosLote('cerrar')" class="text-gray-400 hover:text-emerald-600 font-black text-xl leading-none px-2">&times;</button>
            </div>
            
            <form id="formGastoLevante" class="space-y-3 text-sm">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Lote Destino</label>
                    <select id="gasto_levante_lote" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-600 outline-none font-bold cursor-pointer text-sm" required></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Categoría del Gasto</label>
                    <select id="gasto_levante_tipo" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-600 outline-none font-bold cursor-pointer text-sm" required>
                        <option value="" disabled selected>Selecciona una categoría...</option>
                        <option value="Alimento">Alimento</option>
                        <option value="Medicina y Vitaminas">Medicina y Vitaminas</option>
                        <option value="Salarios">Salarios (Obreros)</option>
                        <option value="Higiene">Higiene y Limpieza</option>
                        <option value="Otros Gastos">Otros Gastos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Descripción</label>
                    <input type="text" id="gasto_levante_concepto" placeholder="Detalle..." class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-600 outline-none font-bold text-sm" required>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Monto ($)</label>
                        <input type="number" step="0.1" min="0" id="gasto_levante_monto" placeholder="0.00" class="w-full p-2.5 bg-emerald-50 border border-emerald-300 rounded focus:ring-1 focus:ring-emerald-600 outline-none font-bold text-emerald-800 text-sm" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5 uppercase tracking-wider">Fecha</label>
                        <input type="date" id="gasto_levante_fecha" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-600 outline-none font-bold cursor-pointer text-sm" required>
                    </div>
                </div>
                <button type="submit" class="w-full h-10 bg-emerald-600 text-white font-black rounded hover:bg-emerald-800 shadow transition text-sm mt-1">Sumar a la Ficha</button>
            </form>
        </div>
    </div>
</div>

<script>
    function toggleFomulariosLote(accion) {
        const fNuevo = document.getElementById('contenedor-nuevo-lote');
        const fEditar = document.getElementById('contenedor-editar-lote');
        const fGasto = document.getElementById('contenedor-gasto-levante');
        
        fNuevo.classList.add('hidden');
        fEditar.classList.add('hidden');
        fGasto.classList.add('hidden');

        if (accion === 'nuevo') {
            fNuevo.classList.remove('hidden');
            fNuevo.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (accion === 'editar') {
            fEditar.classList.remove('hidden');
            fEditar.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (accion === 'gasto') {
            fGasto.classList.remove('hidden');
            fGasto.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
            document.getElementById('panel-lotes').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }
</script>
