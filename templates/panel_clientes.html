<div id="panel-clientes" class="panel-seccion hidden space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-t-4 border-t-blue-600">
            <h2 id="titulo-form-cliente" class="text-base font-bold text-blue-700 mb-4 flex items-center gap-2">➕ Registrar Cliente</h2>
            <form id="formDirCliente" class="space-y-4">
                <input type="hidden" id="dir_cliente_id">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">CÉDULA O RIF</label>
                    <input type="text" id="dir_cliente_doc" placeholder="Ej: V-12345678" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold font-mono">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">NOMBRE COMPLETO</label>
                    <input type="text" id="dir_cliente_nombre" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">TELÉFONO</label>
                    <input type="text" id="dir_cliente_tlf" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded">
                </div>
                <div class="flex gap-2">
                    <button type="submit" id="btn-guardar-cliente" class="flex-1 bg-blue-600 text-white font-bold p-3 rounded hover:bg-blue-800 transition shadow">Guardar</button>
                    <button type="button" id="btn-cancelar-cliente" onclick="limpiarFormCliente()" class="hidden bg-gray-500 text-white font-bold p-3 rounded hover:bg-gray-600 transition shadow">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-base font-bold text-gray-800 mb-4">Cartera de Clientes Registrados</h2>
            <div class="overflow-x-auto border border-gray-200 rounded-lg max-h-96 overflow-y-auto">
                <table class="min-w-full divide-y divide-gray-200 text-left text-sm">
                    <thead class="bg-gray-100 sticky top-0 shadow-sm z-10">
                        <tr>
                            <th class="px-4 py-3 font-semibold text-gray-700">Documento</th>
                            <th class="px-4 py-3 font-semibold text-gray-700">Nombre / Razón Social</th>
                            <th class="px-4 py-3 font-semibold text-gray-700">Teléfono</th>
                            <th class="px-4 py-3 font-semibold text-gray-700 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-directorio-clientes" class="divide-y divide-gray-200 bg-white">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
