<div id="panel-clientes" class="panel-seccion hidden space-y-4 w-full mt-2">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        
        <!-- Formulario Compacto -->
        <div class="bg-white p-5 rounded-lg shadow-md border border-gray-200 border-t-4 border-t-comarca-rojo h-fit">
            <h2 id="titulo-form-cliente" class="text-sm font-black text-comarca-rojo mb-4 flex items-center gap-2">➕ Registrar Cliente</h2>
            <form id="formDirCliente" class="space-y-3">
                <input type="hidden" id="dir_cliente_id">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5">CÉDULA O RIF</label>
                    <input type="text" id="dir_cliente_doc" placeholder="Ej: V-12345678" class="w-full h-10 px-3 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold font-mono text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5">NOMBRE COMPLETO</label>
                    <input type="text" id="dir_cliente_nombre" class="w-full h-10 px-3 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold text-sm" required>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5">TELÉFONO</label>
                    <input type="text" id="dir_cliente_tlf" class="w-full h-10 px-3 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-red-800 outline-none font-bold text-sm">
                </div>
                <div class="flex gap-2 pt-1">
                    <button type="submit" id="btn-guardar-cliente" class="flex-1 h-10 bg-comarca-rojo text-white font-black rounded hover:bg-red-900 transition shadow-sm text-sm">Guardar</button>
                    <button type="button" id="btn-cancelar-cliente" onclick="limpiarFormCliente()" class="hidden h-10 px-4 bg-gray-500 text-white font-black rounded hover:bg-gray-600 transition shadow-sm text-sm">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Tarjetas Anti-Scroll -->
        <div class="lg:col-span-2 bg-white rounded-lg shadow-sm border border-gray-300 overflow-hidden">
            <div class="bg-comarca-rojo p-2.5 flex justify-between items-center text-white">
                <h2 class="text-xs font-black uppercase tracking-wider ml-1">Cartera de Clientes Registrados</h2>
            </div>
            
            <!-- CONTENEDOR FLEXIBLE (Sin tablas) -->
            <div id="tabla-directorio-clientes" class="flex flex-col max-h-[500px] overflow-y-auto bg-gray-50/50">
                <div class="p-8 text-center text-gray-500 font-bold animate-pulse text-sm">Cargando clientes...</div>
            </div>
            
        </div>
    </div>
</div>
