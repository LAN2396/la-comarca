<div id="panel-facturacion" class="panel-seccion hidden max-w-6xl mx-auto w-full mt-2">
    <div class="bg-white rounded-xl shadow-xl border border-red-100 overflow-hidden flex flex-col">
        
        <div class="bg-comarca-rojo px-5 py-3.5 flex justify-between items-center text-white">
            <h2 class="text-sm font-black uppercase tracking-widest flex items-center gap-2">
                <span>🧾</span> Punto de Venta Integrado
            </h2>
        </div>

        <div class="p-4 sm:p-5 grid grid-cols-1 lg:grid-cols-12 gap-5 lg:gap-6">
            
            <div class="lg:col-span-7 space-y-5">
                
                <!-- PASO 1 -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-[11px] font-black text-comarca-rojo uppercase tracking-widest flex items-center gap-1">
                            <span>👤</span> 1. Asignar Cliente
                        </label>
                        <button type="button" onclick="document.getElementById('form-rapido-cliente').classList.toggle('hidden')" class="text-[10px] font-black text-comarca-rojo hover:text-white hover:bg-comarca-rojo bg-red-50 border border-red-200 px-2.5 py-1 rounded uppercase transition-colors">
                            + Nuevo Cliente
                        </button>
                    </div>
                    <select id="fact_cliente_id" class="w-full h-11 px-3 bg-gray-50 border border-gray-300 rounded-lg font-bold text-sm outline-none focus:ring-2 focus:ring-red-900 cursor-pointer text-gray-800">
                        <option value="" disabled selected>Cargando clientes...</option>
                    </select>

                    <div id="form-rapido-cliente" class="hidden mt-3 p-3 bg-red-50 border border-red-200 rounded-lg space-y-2.5 shadow-inner">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                             <input type="text" id="c_doc" placeholder="Cédula / RIF" class="w-full h-10 px-3 bg-white border border-red-200 rounded text-xs font-bold uppercase outline-none focus:ring-1 focus:ring-red-900">
                             <input type="text" id="c_nombre" placeholder="Nombre completo *" class="w-full h-10 px-3 bg-white border border-red-200 rounded text-xs font-bold outline-none focus:ring-1 focus:ring-red-900">
                        </div>
                        <input type="text" id="c_tlf" placeholder="Teléfono" class="w-full h-10 px-3 bg-white border border-red-200 rounded text-xs font-bold outline-none focus:ring-1 focus:ring-red-900">
                        <button type="button" onclick="registrarClienteRapidoPOS()" class="w-full h-10 bg-comarca-rojo text-white font-black rounded hover:bg-red-900 shadow uppercase text-[11px] tracking-wider">Guardar Cliente</button>
                    </div>
                </div>

                <hr class="border-red-100 border-dashed">

                <!-- PASO 2 -->
                <div>
                    <label class="text-[11px] font-black text-comarca-rojo uppercase tracking-widest flex items-center gap-1 mb-2">
                        <span>🥚</span> 2. Elegir Producto y Cantidad
                    </label>
                    <div class="flex flex-col sm:flex-row items-end gap-3">
                        <div class="flex-1 w-full">
                            <label class="block text-[10px] font-black text-gray-500 uppercase mb-1 ml-1">Catálogo</label>
                            <select id="fact_producto_id" onchange="actualizarPrecioSugeridoPOS()" class="w-full h-11 px-3 bg-gray-50 border border-gray-300 rounded-lg font-bold text-sm outline-none focus:ring-2 focus:ring-red-900 cursor-pointer text-gray-800">
                                <option value="" disabled selected>Seleccione un tipo...</option>
                            </select>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto">
                            <div class="w-1/2 sm:w-20">
                                <label class="block text-[10px] font-black text-gray-500 uppercase mb-1 text-center">CTN</label>
                                <input type="number" min="0" id="fact_cant_cartones" value="0" class="w-full h-11 px-2 bg-white border border-gray-300 rounded-lg font-black font-mono text-center text-lg text-gray-800 outline-none focus:ring-2 focus:ring-red-900">
                            </div>
                            <div class="w-1/2 sm:w-20">
                                <label class="block text-[10px] font-black text-gray-500 uppercase mb-1 text-center">CJ</label>
                                <input type="number" min="0" id="fact_cant_cajas" value="0" class="w-full h-11 px-2 bg-white border border-gray-300 rounded-lg font-black font-mono text-center text-lg text-gray-800 outline-none focus:ring-2 focus:ring-red-900">
                            </div>
                        </div>
                        <button type="button" onclick="agregarAlCarritoPOS()" class="w-full sm:w-auto h-11 px-5 bg-comarca-dorado text-black font-black rounded-lg hover:bg-yellow-500 shadow-md uppercase text-xs tracking-wide">
                            AÑADIR
                        </button>
                    </div>
                </div>

                <!-- Carrito -->
                <div class="flex-1 flex flex-col border border-gray-200 rounded-lg overflow-hidden bg-gray-50 mt-2 shadow-inner">
                    <div class="bg-gray-200 p-2 text-[10px] font-black text-gray-600 uppercase tracking-widest text-center border-b border-gray-300">
                        Detalle del Carrito
                    </div>
                    <div id="tabla-carrito-body" class="flex flex-col divide-y divide-gray-200 min-h-[120px] max-h-56 overflow-y-auto">
                        <div class="p-6 text-center text-gray-400 font-bold italic text-sm">El carrito está vacío.</div>
                    </div>
                </div>
            </div>

            <!-- PASO 3 -->
            <div class="lg:col-span-5 bg-gray-50 p-4 rounded-xl border border-gray-200 flex flex-col justify-between shadow-inner">
                <div class="space-y-4">
                    <h3 class="text-xs font-black text-comarca-rojo uppercase tracking-widest border-b border-gray-300 pb-2 flex items-center gap-1.5">
                        <span>💳</span> 3. Resumen y Cobro
                    </h3>
                    
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 mb-1 uppercase tracking-wider ml-1">Método de Pago</label>
                        <select id="fact_condicion" onchange="alternarDiasCreditoPOS(); actualizarTotalBCV();" class="w-full h-11 px-3 bg-white border border-gray-300 rounded-lg font-bold text-gray-800 outline-none focus:ring-2 focus:ring-red-900 text-sm cursor-pointer">
                            <option value="Efectivo">💵 Efectivo (USD)</option>
                            <option value="Transferencia">🏦 Transf. / Zelle</option>
                            <option value="Pago Móvil">📱 Pago Móvil (Bs)</option>
                            <option value="Crédito">⏳ Venta a Crédito</option>
                        </select>
                    </div>
                    
                    <div id="contenedor_dias_credito" class="hidden bg-yellow-50 p-3 rounded-lg border border-yellow-200 shadow-sm">
                        <label class="block text-[10px] font-black text-comarca-dorado mb-1 uppercase tracking-wider text-center">Días de Crédito</label>
                        <input type="number" min="1" id="fact_dias_credito" value="15" class="w-full h-10 px-3 bg-white border border-yellow-300 rounded-lg font-black font-mono text-center text-base text-yellow-700 outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 mb-1 uppercase tracking-wider ml-1">Aplicar Descuento</label>
                        <div class="flex h-11 shadow-sm rounded-lg overflow-hidden border border-gray-300 focus-within:ring-2 focus-within:ring-red-900">
                            <select id="fact_desc_tipo" onchange="actualizarTablaCarritoPOS()" class="px-3 bg-gray-100 border-r border-gray-300 font-black text-sm text-comarca-rojo outline-none cursor-pointer">
                                <option value="%">%</option>
                                <option value="$">$</option>
                            </select>
                            <input type="number" min="0" step="0.5" id="fact_descuento" value="0" oninput="actualizarTablaCarritoPOS()" class="w-full px-3 bg-white font-black font-mono text-center text-lg text-comarca-rojo outline-none">
                        </div>
                    </div>
                </div>

                <div class="border-t border-gray-300 pt-4 mt-5 space-y-2">
                    <div class="flex justify-between items-center text-gray-500 font-bold text-sm px-1">
                        <span>Subtotal:</span>
                        <span id="fact_subtotal_lbl" class="font-mono text-base text-gray-700">$0.00</span>
                    </div>
                    <div class="flex justify-between items-center text-comarca-rojo font-bold text-sm px-1">
                        <span>Descuento:</span>
                        <span id="fact_descuento_lbl" class="font-mono text-base">-$0.00</span>
                    </div>
                    
                    <div class="flex justify-between items-center bg-white p-3.5 rounded-lg border border-gray-300 mt-2 shadow-sm">
                        <span class="font-black text-gray-800 text-sm uppercase tracking-wider">TOTAL:</span>
                        <div class="text-right">
                            <span id="fact_total_lbl" class="text-3xl font-black text-comarca-rojo font-mono block leading-none">$0.00</span>
                        </div>
                    </div>
                    
                    <div class="text-right mt-1.5 min-h-[22px]">
                        <span id="fact_total_bs_lbl" class="text-[11px] font-black text-gray-700 font-mono hidden bg-yellow-50 px-2 py-1 rounded border border-yellow-200 inline-block">Bs 0.00</span>
                    </div>
                    
                    <button type="button" onclick="procesarFacturaFinalPOS()" class="w-full mt-3 h-12 bg-comarca-rojo text-white font-black rounded-lg hover:bg-red-900 shadow-md transition-all uppercase tracking-widest text-base flex justify-center items-center gap-2 active:scale-95">
                        <span>FACTURAR</span> <span>✓</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
