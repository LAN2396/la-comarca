<div id="panel-usuarios" class="panel-seccion hidden space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-t-4 border-t-blue-800">
            <h2 class="text-base font-bold text-blue-900 mb-4 flex items-center gap-2">👤 Otorgar Acceso</h2>
            <form id="formUsuario" onsubmit="crearUsuarioNuevo(event)" autocomplete="off" class="space-y-4 text-sm">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">NUEVO USUARIO</label>
                    <input type="text" id="nuevo_user_nombre" autocomplete="new-password" placeholder="Ej: perez_j" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">CONTRASEÑA SEGURA</label>
                    <input type="password" id="nuevo_user_pass" autocomplete="new-password" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 ml-1 mb-1">ROL DEL SISTEMA</label>
                    <select id="nuevo_user_rol" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded font-bold text-gray-700" required>
                        <option value="Empleado">Empleado (Solo Operativo)</option>
                        <option value="Inversor">Inversor (Solo Finanzas y Tablas)</option>
                        <option value="Administrador">Administrador (Acceso Total)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-800 text-white font-bold p-3 rounded hover:bg-blue-900 shadow transition">Generar Credenciales</button>
            </form>
        </div>

        <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-base font-bold text-gray-800 mb-4">Usuarios Activos en La Comarca</h2>
            <div class="overflow-x-auto border border-gray-200 rounded-lg max-h-[400px] overflow-y-auto">
                <table class="min-w-full divide-y divide-gray-200 text-left text-sm">
                    <thead class="bg-gray-100 sticky top-0 shadow-sm z-10">
                        <tr>
                            <th class="px-4 py-3 font-semibold text-gray-700">Usuario ID</th>
                            <th class="px-4 py-3 font-semibold text-gray-700">Nivel de Acceso</th>
                            <th class="px-4 py-3 font-semibold text-gray-700 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios" class="divide-y divide-gray-200 bg-white">
                        <tr><td colspan="3" class="px-4 py-8 text-center text-gray-400 italic">Cargando base de datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
