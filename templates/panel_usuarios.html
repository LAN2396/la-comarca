<div id="panel-usuarios" class="panel-seccion hidden space-y-4 w-full mt-2">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        
        <div class="bg-white p-5 rounded-lg shadow-md border border-gray-200 border-t-4 border-t-gray-800 h-fit">
            <h2 class="text-sm font-black text-gray-800 mb-4 flex items-center gap-2">👤 Otorgar Acceso</h2>
            <form id="formUsuario" onsubmit="crearUsuarioNuevo(event)" autocomplete="off" class="space-y-3 text-sm">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5">NUEVO USUARIO</label>
                    <input type="text" id="nuevo_user_nombre" autocomplete="new-password" placeholder="Ej: perez_j" class="w-full h-10 px-3 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-gray-800 outline-none font-bold text-sm" required>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5">CONTRASEÑA SEGURA</label>
                    <input type="password" id="nuevo_user_pass" autocomplete="new-password" class="w-full h-10 px-3 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-gray-800 outline-none font-bold text-sm" required>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 ml-1 mb-0.5">ROL DEL SISTEMA</label>
                    <select id="nuevo_user_rol" class="w-full h-10 px-3 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-gray-800 outline-none font-bold text-gray-700 text-sm cursor-pointer" required>
                        <option value="Empleado">Empleado (Solo Operativo)</option>
                        <option value="Inversor">Inversor (Solo Finanzas y Tablas)</option>
                        <option value="Administrador">Administrador (Acceso Total)</option>
                    </select>
                </div>
                <button type="submit" class="w-full h-10 bg-gray-800 text-white font-black rounded hover:bg-black shadow-sm transition mt-2 text-sm">Generar Credenciales</button>
            </form>
        </div>

        <div class="lg:col-span-2 bg-white rounded-lg shadow-sm border border-gray-300 overflow-hidden">
            <div class="bg-gray-800 p-2.5 flex justify-between items-center text-white">
                <h2 class="text-xs font-black uppercase tracking-wider ml-1">Usuarios Activos en La Comarca</h2>
            </div>
            <div class="overflow-x-auto max-h-[400px] overflow-y-auto bg-gray-50/50">
                <table class="min-w-full divide-y divide-gray-200 text-left text-sm">
                    <thead class="bg-gray-100 sticky top-0 shadow-sm z-10">
                        <tr>
                            <th class="px-4 py-2 font-black text-gray-600 text-[10px] uppercase">Usuario ID</th>
                            <th class="px-4 py-2 font-black text-gray-600 text-[10px] uppercase">Nivel de Acceso</th>
                            <th class="px-4 py-2 font-black text-gray-600 text-[10px] uppercase text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios" class="divide-y divide-gray-200 bg-white">
                        <tr><td colspan="3" class="px-4 py-8 text-center text-gray-400 italic font-bold">Cargando base de datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
