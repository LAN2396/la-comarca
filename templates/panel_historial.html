<div id="panel-historial" class="panel-seccion hidden w-full mt-2">
    <div class="bg-white rounded-lg shadow-sm border border-gray-300 overflow-hidden">
        
        <div class="bg-comarca-rojo p-3.5 flex flex-col md:flex-row md:items-center md:justify-between gap-3 text-white">
            <h2 class="text-sm font-black uppercase tracking-wider ml-1 flex items-center gap-2">
                <span>📈</span> Registros Acumulados
            </h2>
            
            <div class="inline-flex rounded shadow-sm bg-white" role="group">
                <button onclick="cargarHistorial(7)" id="btn-hist-7" class="px-4 py-2 text-[11px] font-black uppercase rounded-l border border-gray-300 text-gray-700 hover:bg-gray-100 transition-colors">7 Días</button>
                <button onclick="cargarHistorial(30)" id="btn-hist-30" class="px-4 py-2 text-[11px] font-black uppercase border-t border-b border-gray-300 bg-white text-gray-700 hover:bg-gray-100 transition-colors">30 Días</button>
                <button onclick="cargarHistorial(0)" id="btn-hist-0" class="px-4 py-2 text-[11px] font-black uppercase rounded-r border border-gray-300 bg-white text-gray-700 hover:bg-gray-100 transition-colors">Histórico</button>
            </div>
        </div>
        
        <!-- CONTENEDOR FLEXIBLE (Adiós a las Tablas y al error de desbordamiento) -->
        <div id="tabla-historial" class="flex flex-col max-h-[600px] overflow-y-auto bg-gray-50/50">
            <div class="p-8 text-center text-gray-500 font-bold animate-pulse text-sm">Cargando registros...</div>
        </div>

    </div>
</div>
