<div id="pantalla-login" class="fixed inset-0 bg-gray-900 z-[999] flex items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm border-t-8 border-t-comarca-rojo transform transition-all">
        <div class="text-center mb-8 flex flex-col items-center">
            
            <!-- Aquí cambiamos a la versión a color -->
            <img src="/static/icono.png" alt="Logo La Comarca" class="w-24 h-24 object-contain mb-3">
            
            <h1 class="text-2xl font-black text-gray-800">La Comarca</h1>
            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mt-1">Control de Acceso</p>
        </div>
        <form id="formLogin" class="space-y-5">
            <div>
                <label class="block text-[10px] font-black text-gray-500 ml-1 mb-1 uppercase">Usuario</label>
                <input type="text" id="login_user" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg font-bold outline-none focus:ring-2 focus:ring-red-800 focus:border-red-800 transition" required>
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-500 ml-1 mb-1 uppercase">Contraseña</label>
                <input type="password" id="login_pass" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg font-bold outline-none focus:ring-2 focus:ring-red-800 focus:border-red-800 transition" required>
            </div>
            <div id="login_error" class="hidden text-xs font-bold text-red-600 text-center bg-red-50 p-2 rounded border border-red-200"></div>
            <button type="submit" class="w-full bg-comarca-rojo text-white font-black p-3.5 rounded-lg shadow-md hover:bg-red-900 transition flex items-center justify-center gap-2">
                <span>Ingresar al Sistema</span> <span>🔒</span>
            </button>
        </form>
    </div>
</div>
